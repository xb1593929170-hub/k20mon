name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Go 后端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/k20mon-server .

  web:
    name: Vue 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  agent:
    name: 控制代理
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 语法检查
        run: python -m py_compile k20mon_agent.py rate_sync.py
      - name: 单元测试
        run: python -m unittest test_agent test_rate_sync -v

  compose:
    name: Compose 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 渲染 compose
        run: |
          cd deploy
          cp .env.example .env
          cp config.yaml.example config.yaml
          docker compose config > /dev/null
