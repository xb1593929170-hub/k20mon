services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        # 国内网络建议改成 https://goproxy.cn,direct
        GOPROXY: ${K20MON_GOPROXY:-https://proxy.golang.org,direct}
        RUNTIME_IMAGE: ${K20MON_SERVER_RUNTIME:-alpine:3.20}
    image: k20mon/server:${K20MON_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${K20MON_SERVER_PORT:-18888}:8888"
    volumes:
      # 只读配置：MySQL / JWT / 监听端口
      - ${K20MON_CONFIG_PATH:-./config.yaml}:/etc/k20mon/config.yaml:ro
      # 采集来源，全部只读
      - /sys:/sys:ro
      - /proc:/proc:ro
      # root 代理的 Unix socket 目录（需要可写，因为 socket 由代理创建）
      - ${K20MON_CONTROL_DIR:-/run/k20mon-status}:/run/k20mon-status
    environment:
      K20M_INTERVAL: "${K20M_INTERVAL:-5}"
      K20M_RETENTION_H: "${K20M_RETENTION_H:-720}"
      K20M_CONTROL_SOCKET: /run/k20mon-status/control.sock
      K20MON_CONFIG_PATH: /etc/k20mon/config.yaml
      TZ: "${TZ:-Asia/Shanghai}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        RUNTIME_IMAGE: ${K20MON_WEB_RUNTIME:-nginx:alpine}
    image: k20mon/web:${K20MON_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${K20MON_WEB_PORT:-8899}:8080"
    depends_on:
      server:
        condition: service_healthy
